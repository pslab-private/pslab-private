<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 900 405" role="img" aria-labelledby="pipe-title pipe-desc"><title id="pipe-title">Two data paths from the same contact scene</title><desc id="pipe-desc">Native tactile yields depth and speed; the contact solver yields forces in newtons. Forces are rotated, summed and distributed in pad coordinates.</desc><rect width="900" height="405" fill="#f5f9fa"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#698894"></path></marker></defs><g font-family="Malgun Gothic, sans-serif" fill="#172c3b"><rect x="28" y="141" width="176" height="107" rx="10" fill="#e4edf3"></rect><text x="116" y="181" text-anchor="middle" font-size="17" font-weight="700">Hand–object contact</text><text x="116" y="211" text-anchor="middle" font-size="13">Shape · pose · velocity</text><path d="M204 170H240V77H278M204 219H278" fill="none" stroke="#698894" stroke-width="2" marker-end="url(#arr)"></path><rect x="280" y="30" width="278" height="95" rx="10" fill="#e8effb"></rect><text x="300" y="65" font-size="16" font-weight="700">A · native tactile</text><text x="300" y="96" font-size="13">Depth (m) / slip speed (m/s)</text><path d="M558 77H608" stroke="#698894" stroke-width="2" marker-end="url(#arr)"></path><text x="625" y="70" font-size="16">sensordata</text><text x="625" y="97" font-size="13" fill="#536777">Diagnostic, not force input</text><rect x="280" y="160" width="278" height="110" rx="10" fill="#dff3ed"></rect><text x="300" y="199" font-size="16" font-weight="700">B · Dynamics / contact solver</text><text x="300" y="232" font-size="13">mj_contactForce → force (N)</text><path d="M558 215H608" stroke="#698894" stroke-width="2" marker-end="url(#arr)"></path><rect x="610" y="160" width="260" height="110" rx="10" fill="#dff3ed"></rect><text x="630" y="199" font-size="16" font-weight="700">Pad mask · sign · rotation</text><text x="630" y="232" font-size="13">World → fixed pad frame</text><path d="M740 270V310H420V328" fill="none" stroke="#698894" stroke-width="2" marker-end="url(#arr)"></path><rect x="280" y="330" width="590" height="51" rx="8" fill="#0b8179"></rect><text x="575" y="363" text-anchor="middle" font-size="16" fill="white">15 forces / 176 × 3 taxel forces / 5 × 3 × 48 × 32 images</text></g></svg>