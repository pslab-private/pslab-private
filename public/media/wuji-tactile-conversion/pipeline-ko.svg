<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 900 405" role="img" aria-labelledby="pipe-title pipe-desc"><title id="pipe-title">동일한 접촉 장면에서 갈라지는 두 데이터 경로</title><desc id="pipe-desc">물리 접촉에서 native tactile은 깊이와 속력으로, 접촉 솔버는 뉴턴 단위 힘으로 이어진다. 힘을 패드 좌표계로 변환하고 합산 및 분배하여 촉각 출력을 만든다.</desc><rect width="900" height="405" fill="#f5f9fa"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#698894"></path></marker></defs><g font-family="Malgun Gothic, sans-serif" fill="#172c3b"><rect x="28" y="141" width="176" height="107" rx="10" fill="#e4edf3"></rect><text x="116" y="181" text-anchor="middle" font-size="20" font-weight="700">손 ↔ 물체 접촉</text><text x="116" y="211" text-anchor="middle" font-size="15">형상 · 자세 · 속도</text><path d="M204 170H240V77H278M204 219H278" fill="none" stroke="#698894" stroke-width="2" marker-end="url(#arr)"></path><rect x="280" y="30" width="278" height="95" rx="10" fill="#e8effb"></rect><text x="300" y="65" font-size="19" font-weight="700">A · native tactile</text><text x="300" y="96" font-size="15">깊이(m) / 접선 속력(m/s)</text><path d="M558 77H608" stroke="#698894" stroke-width="2" marker-end="url(#arr)"></path><text x="625" y="70" font-size="19">sensordata</text><text x="625" y="97" font-size="15" fill="#536777">진단 채널 · 힘 변환 입력 아님</text><rect x="280" y="160" width="278" height="110" rx="10" fill="#dff3ed"></rect><text x="300" y="199" font-size="19" font-weight="700">B · 동역학 / 접촉 솔버</text><text x="300" y="232" font-size="15">mj_contactForce → 접촉력(N)</text><path d="M558 215H608" stroke="#698894" stroke-width="2" marker-end="url(#arr)"></path><rect x="610" y="160" width="260" height="110" rx="10" fill="#dff3ed"></rect><text x="630" y="199" font-size="18" font-weight="700">패드 판정 · 부호 · 좌표 변환</text><text x="630" y="232" font-size="15">세계 좌표 → 고정 패드 좌표</text><path d="M740 270V310H420V328" fill="none" stroke="#698894" stroke-width="2" marker-end="url(#arr)"></path><rect x="280" y="330" width="590" height="51" rx="8" fill="#0b8179"></rect><text x="575" y="363" text-anchor="middle" font-size="19" fill="white">15개 합력  /  176 × 3 감지점 힘  /  5 × 3 × 48 × 32 이미지</text></g></svg>